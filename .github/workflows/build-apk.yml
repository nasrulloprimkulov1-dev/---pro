name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Flet
        run: pip install flet
      - name: Build
        run: flet build apk --yes
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TeacherPro-APK
          path: build/apk/*.apk
